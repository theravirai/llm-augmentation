[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-augmentation"
version = "0.1.0"
description = "LLM-Augmented Java Program Analysis and Fault Localization via SootUp & MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
llm-aug = "llm_augmentation.cli:main"
